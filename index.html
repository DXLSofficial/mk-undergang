<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación de Mario Kart: Live X</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141419;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 90px;
        }
        
        /* PANTALLA DE BLOQUEO GLOBAL */
        #pantalla-bloqueo-global {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0d0d11;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .caja-bloqueo {
            background-color: #1e1e24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            border: 2px solid #333;
            max-width: 90%;
            width: 320px;
        }
        .caja-bloqueo h3 { margin-top: 0; color: #ff4757; }
        .input-bloqueo {
            width: 90%;
            background-color: #141419;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        
        /* ESTILO NUEVO PARA LA OPCION RECUERDAME */
        .contenedor-recuerdame {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
            user-select: none;
        }
        .contenedor-recuerdame input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #4af;
        }

        .btn-bloqueo {
            background-color: #4af;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-bloqueo:hover { background-color: #29f; }

        /* INTERFAZ PRINCIPAL */
        #contenido-principal {
            display: none; 
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: #4af; 
            text-shadow: 0 0 10px rgba(68, 170, 255, 0.4);
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitulo {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            background-color: #1e1e24;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            min-height: 60px;
        }
        .tabla-animada {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        
        :root {
            --columnas-estructura: 0.5fr 1.5fr 0.8fr 1fr 1.2fr;
        }

        .fila-header {
            display: grid;
            grid-template-columns: var(--columnas-estructura);
            padding: 10px 15px;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            border-bottom: 2px solid #2a2a35;
            text-align: center;
            transition: grid-template-columns 0.3s ease;
        }
        .fila-header div:nth-child(2) { text-align: left; }

        .fila-jugador {
            display: grid;
            grid-template-columns: var(--columnas-estructura);
            align-items: center;
            padding: 12px 15px;
            background-color: #2a2a35;
            border-radius: 8px;
            border: 2px solid transparent;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s, grid-template-columns 0.3s ease;
        }
        .fila-jugador div:nth-child(2) { text-align: left; }
        .fila-jugador:hover { background-color: #333344; }

        .puesto-1 { border-color: #ffd700; background-color: rgba(255, 215, 0, 0.05); }
        .puesto-2 { border-color: #c0c0c0; background-color: rgba(192, 192, 192, 0.05); }
        .puesto-3 { border-color: #cd7f32; background-color: rgba(205, 127, 50, 0.05); }
        .puesto-normal { border-color: #8a2be2; background-color: rgba(138, 43, 226, 0.03); }
        .puesto-ultimo { border-color: #2ecc71; background-color: rgba(46, 204, 113, 0.05); }

        .posicion { font-weight: bold; font-size: 1.1rem; }
        .puesto-1 .posicion { color: #ffd700; text-shadow: 0 0 5px rgba(255,215,0,0.5); }
        .puesto-2 .posicion { color: #c0c0c0; }
        .puesto-3 .posicion { color: #cd7f32; }
        .puesto-normal .posicion { color: #a855f7; }
        .puesto-ultimo .posicion { color: #2ecc71; }

        .nombre { font-weight: 500; font-size: 1.05rem; }
        .puntos-copas { font-weight: bold; font-size: 1.2rem; color: #fff; }
        .total-carreras-num { font-weight: bold; font-size: 1.15rem; color: #ff9f43; }

        .control-valores {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-accion {
            border: none;
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .btn-accion:active { transform: scale(0.9); }
        .btn-mas { background-color: #2ecc71; }
        .btn-mas:hover { background-color: #27ae60; }
        .btn-menos { background-color: #e74c3c; }
        .btn-menos:hover { background-color: #c0392b; }

        .total-carrera {
            font-weight: bold;
            font-size: 1.15rem;
            color: #2f2;
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.2);
        }
        .input-sumar-carrera {
            width: 75px;
            background-color: #141419;
            border: 1px solid #555;
            color: #4af;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }
        
        .admin-detalles {
            margin-top: 20px;
            width: 100%;
            background-color: #1e1e24;
            border-radius: 12px;
            border: 1px solid #333;
            display: none; 
        }
        .admin-summary {
            padding: 12px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }
        .admin-content {
            padding: 20px;
            border-top: 1px solid #2a2a35;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: space-around;
        }
        .admin-box { display: flex; flex-direction: column; gap: 10px; min-width: 250px; }
        .admin-box h3 { margin: 0 0 5px 0; font-size: 1rem; color: #ccc; }
        .admin-input, .admin-select {
            background-color: #141419;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
        }
        .btn-admin { border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add { background-color: #2ecc71; color: #fff; }
        .btn-remove { background-color: #e74c3c; color: #fff; }
        .btn-save-crypto { background-color: #ff9f43; color: #141419; font-weight: bold; }
        .btn-save-crypto:hover { background-color: #ee8e32; }
        
        .btn-reset {
            background-color: transparent;
            border: 1px solid #444;
            color: #666;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-reset:hover { border-color: #e74c3c; color: #e74c3c; }

        .btn-login-flotante {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #2c2c38;
            border: 2px solid #555;
            color: #aaa;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            transition: all 0.2s ease;
        }
        .btn-login-flotante.activo {
            background-color: #e74c3c;
            border-color: #ff6b6b;
            color: #fff;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="pantalla-bloqueo-global">
        <div class="caja-bloqueo">
            <h3>Acceso Privado</h3>
            <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 20px;">Esta clasificación es privada. Introduce la contraseña.</p>
            <input type="password" id="clave-acceso-crew" class="input-bloqueo" placeholder="Contraseña..." onkeydown="evaluarEnterBloqueo(event)">
            
            <label class="contenedor-recuerdame">
                <input type="checkbox" id="check-recuerdame"> Recuerdame en este dispositivo
            </label>

            <button class="btn-bloqueo" onclick="verificarAccesoGlobal()">Entrar a la Pista</button>
        </div>
    </div>

    <div id="contenido-principal" style="display:none;">
        <h2>|| Clasificación de Mario Kart: Live X ||</h2>
        <div class="subtitulo">Sincronizado en Tiempo Real para la Crew</div>

        <div class="container">
            <div class="fila-header" id="tabla-header"></div>
            <div id="tabla-body" class="tabla-animada"></div>
        </div>

        <details class="admin-detalles" id="panel-gestion-root">
            <summary class="admin-summary">⚙️ Panel de Gestión</summary>
            <div class="admin-content">
                <div class="admin-box">
                    <h3>Añadir Nuevo Corredor</h3>
                    <input type="text" id="nuevo-nombre" class="admin-input" placeholder="Nombre...">
                    <button class="btn-admin btn-add" onclick="agregarJugador()">＋ Registrar</button>
                </div>
                
                <div class="admin-box">
                    <h3>Eliminar Corredor</h3>
                    <select id="select-eliminar" class="admin-select"></select>
                    <button class="btn-admin btn-remove" onclick="eliminarJugador()">✕ Eliminar</button>
                </div>

                <div class="admin-box" style="border: 1px dashed #444; padding: 15px; border-radius: 8px;">
                    <h3 style="color: #ff9f43;">🔐 Seguridad y Claves</h3>
                    <select id="tipo-clave-cambiar" class="admin-select">
                        <option value="crew">Contraseña de Entrada (Crew)</option>
                        <option value="admin">Contraseña de Administrador</option>
                    </select>
                    <input type="password" id="nueva-clave-valor" class="admin-input" placeholder="Nueva Contraseña...">
                    <input type="password" id="confirmar-admin-actual" class="admin-input" placeholder="Contraseña Admin Actual...">
                    <button class="btn-admin btn-save-crypto" onclick="procesarCambioContrasena()">💾 Guardar Nueva Clave</button>
                </div>

                <div style="display: flex; width: 100%; justify-content: center; gap: 10px;">
                    <button class="btn-reset" onclick="reiniciarTabla()">🔄 Reiniciar todo a 0</button>
                </div>
            </div>
        </details>

        <button class="btn-login-flotante" id="btn-candado" onclick="conmutarModoAdmin()">
            <span id="icono-candado">🔒</span> <span id="texto-candado">Modo Admin</span>
        </button>
    </div>

    <script>
        let CLAVE_CREW_SISTEMA = "mario-crew-2026";
        let CLAVE_SECRETA_ADMIN = "enerbelaskn25";

        function evaluarEnterBloqueo(e) {
            if(e.key === 'Enter') verificarAccesoGlobal();
        }

        function desvanecerBloqueo() {
            document.getElementById('pantalla-bloqueo-global').style.display = 'none';
            document.getElementById('contenido-principal').style.display = 'flex';
        }

        function verificarAccesoGlobal() {
            const input = document.getElementById('clave-acceso-crew');
            const checkRecuerdame = document.getElementById('check-recuerdame');
            
            if (input.value === CLAVE_CREW_SISTEMA) {
                // Si marcó la casilla "Recuérdame", guardamos el token en memoria
                if (checkRecuerdame.checked) {
                    localStorage.setItem('sesion_crew_valida', CLAVE_CREW_SISTEMA);
                } else {
                    // Si no la marcó, nos aseguramos de borrar cualquier rastro viejo
                    localStorage.removeItem('sesion_crew_valida');
                }
                desvanecerBloqueo();
                conectarFirebase();
            } else {
                alert("Contraseña incorrecta. Acceso denegado.");
                input.value = "";
            }
        }

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBaFKG2YA1AGiVWsAmqjWzewGWXq8Szsu0",
            authDomain: "mariokart-live.firebaseapp.com",
            databaseURL: "https://mariokart-live-default-rtdb.firebaseio.com",
            projectId: "mariokart-live",
            storageBucket: "mariokart-live.firebasestorage.app",
            messagingSenderId: "708133885673",
            appId: "1:708133885673:web:2d108ea14651c2f3ac4278"
        };
        
        let db;
        let jugadores = [];
        let modoAdminActivo = false;

        const tablaHeader = document.getElementById('tabla-header');
        const tablaBody = document.getElementById('tabla-body');
        const selectEliminar = document.getElementById('select-eliminar');
        const panelGestionRoot = document.getElementById('panel-gestion-root');
        const btnCandado = document.getElementById('btn-candado');
        const iconoCandado = document.getElementById('icono-candado');
        const textoCandado = document.getElementById('texto-candado');

        if (firebase.apps.length === 0) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        
        db.ref('configuracion/claves').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.crew) CLAVE_CREW_SISTEMA = data.crew;
                if (data.admin) CLAVE_SECRETA_ADMIN = data.admin;
            }
            comprobarSesionesGuardadas();
        });

        function comprobarSesionesGuardadas() {
            const guardadaCrew = localStorage.getItem('sesion_crew_valida');
            const guardadaAdmin = localStorage.getItem('sesion_admin_valida');

            if (guardadaCrew === CLAVE_CREW_SISTEMA) {
                desvanecerBloqueo();
                conectarFirebase();

                if (guardadaAdmin === CLAVE_SECRETA_ADMIN && !modoAdminActivo) {
                    activarInterfazAdmin();
                }
            }
        }

        function conectarFirebase() {
            db.ref('jugadores').on('value', (snapshot) => {
                const datos = snapshot.val();
                if (datos) {
                    jugadores = Object.keys(datos).map(key => ({
                        firebaseKey: key, 
                        ...datos[key]
                    }));
                } else {
                    jugadores = [];
                }
                actualizarSelectEliminar();
                renderTabla();
            });
        }

        function activarInterfazAdmin() {
            modoAdminActivo = true;
            document.documentElement.style.setProperty('--columnas-estructura', '0.5fr 1.5fr 0.9fr 0.9fr 1fr 1.2fr 1.2fr');
            btnCandado.classList.add('activo');
            iconoCandado.innerText = "🔓";
            textoCandado.innerText = "Cerrar Admin";
            panelGestionRoot.style.display = "block";
            renderTabla();
        }

        function conmutarModoAdmin() {
            if (!modoAdminActivo) {
                const intento = prompt("Introduce la contraseña de administrador:");
                if (intento === CLAVE_SECRETA_ADMIN) {
                    // Al ser admin, por comodidad siempre te recordará en tu PC de edición
                    localStorage.setItem('sesion_admin_valida', CLAVE_SECRETA_ADMIN);
                    activarInterfazAdmin();
                } else if (intento !== null) {
                    alert("Contraseña incorrecta.");
                }
            } else {
                modoAdminActivo = false;
                localStorage.removeItem('sesion_admin_valida');
                document.documentElement.style.setProperty('--columnas-estructura', '0.5fr 1.5fr 0.8fr 1fr 1.2fr');
                btnCandado.classList.remove('activo');
                iconoCandado.innerText = "🔒";
                textoCandado.innerText = "Modo Admin";
                panelGestionRoot.style.display = "none";
                panelGestionRoot.removeAttribute("open");
                renderTabla();
            }
        }

        function procesarCambioContrasena() {
            const tipo = document.getElementById('tipo-clave-cambiar').value;
            const nuevaClave = document.getElementById('nueva-clave-valor').value.trim();
            const verificacionAdmin = document.getElementById('confirmar-admin-actual').value;

            if (nuevaClave === "") {
                alert("La nueva contraseña no puede estar vacía.");
                return;
            }

            if (verificacionAdmin !== CLAVE_SECRETA_ADMIN) {
                alert("Error: La 'Contraseña Admin Actual' ingresada es incorrecta.");
                return;
            }

            const nodoDestino = tipo === 'crew' ? 'configuracion/claves/crew' : 'configuracion/claves/admin';
            
            db.ref(nodoDestino).set(nuevaClave)
                .then(() => {
                    alert(`¡Cambio exitoso! Clave de ${tipo === 'crew' ? 'Entrada Crew' : 'Administrador'} actualizada.`);
                    
                    if(tipo === 'crew') {
                        if (localStorage.getItem('sesion_crew_valida')) {
                            localStorage.setItem('sesion_crew_valida', nuevaClave);
                        }
                    } else {
                        localStorage.setItem('sesion_admin_valida', nuevaClave);
                    }

                    document.getElementById('nueva-clave-valor').value = "";
                    document.getElementById('confirmar-admin-actual').value = "";
                })
                .catch((err) => {
                    alert("Error al guardar en Firebase.");
                });
        }

        function mandarANube(jugador) {
            if(jugador.firebaseKey && db) {
                db.ref('jugadores/' + jugador.firebaseKey).set({
                    id: jugador.id,
                    nombre: jugador.nombre,
                    copas: jugador.copas,
                    carreras: jugador.carreras,
                    carreraTotal: jugador.carreraTotal
                });
            }
        }

        function actualizarSelectEliminar() {
            if (!selectEliminar) return;
            selectEliminar.innerHTML = '<option value="" disabled selected>Selecciona un corredor...</option>';
            const copiaAlfabetica = [...jugadores].sort((a, b) => a.nombre.localeCompare(b.nombre));
            copiaAlfabetica.forEach(j => {
                const opt = document.createElement('option');
                opt.value = j.firebaseKey;
                opt.textContent = j.nombre;
                selectEliminar.appendChild(opt);
            });
        }

        function renderTabla() {
            const posicionesViejas = {};
            jugadores.forEach(j => {
                const el = document.getElementById(`jugador-${j.id}`);
                if (el) posicionesViejas[j.id] = el.getBoundingClientRect().top;
            });

            jugadores.sort((a, b) => {
                if (b.copas !== a.copas) return b.copas - a.copas;
                return b.carreraTotal - a.carreraTotal;
            });

            if (modoAdminActivo) {
                tablaHeader.innerHTML = `
                    <div>Pos</div><div style="text-align: left;">Jugador</div><div>🏆 Copas</div><div>Modificar</div><div>🏁 Carreras</div><div>📊 Total Pts</div><div>➕ Añadir Pts</div>
                `;
            } else {
                tablaHeader.innerHTML = `
                    <div>Pos</div><div style="text-align: left;">Jugador</div><div>🏆 Copas</div><div>🏁 Carreras</div><div>📊 Total Pts</div>
                `;
            }

            tablaBody.innerHTML = "";
            const totalJugadores = jugadores.length;

            if (totalJugadores === 0) {
                tablaBody.innerHTML = `<div style="text-align:center; padding:20px; color:#555;">No hay corredores en la pista. Activa el Modo Admin para registrar a la crew.</div>`;
                return;
            }

            jugadores.forEach((jugador, indice) => {
                let clasePuesto = "puesto-normal";
                if (indice === 0) clasePuesto = "puesto-1";
                else if (indice === 1) clasePuesto = "puesto-2";
                else if (indice === 2) clasePuesto = "puesto-3";
                else if (indice === totalJugadores - 1 && totalJugadores > 3) clasePuesto = "puesto-ultimo";

                const fila = document.createElement('div');
                fila.id = `jugador-${jugador.id}`;
                fila.className = `fila-jugador ${clasePuesto}`;
                
                if (modoAdminActivo) {
                    fila.innerHTML = `
                        <div class="posicion">#${indice + 1}</div>
                        <div class="nombre">${jugador.nombre}</div>
                        <div class="puntos-copas">${jugador.copas}</div>
                        <div class="control-valores">
                            <button class="btn-accion btn-mas" onclick="modificarCopas('${jugador.firebaseKey}', 1)">+</button>
                            <button class="btn-accion btn-menos" onclick="modificarCopas('${jugador.firebaseKey}', -1)">-</button>
                        </div>
                        <div class="control-valores">
                            <button class="btn-accion btn-menos" style="width:20px; height:20px; font-size:0.8rem;" onclick="modificarCarreras('${jugador.firebaseKey}', -1)">-</button>
                            <span class="total-carreras-num">${jugador.carreras}</span>
                            <button class="btn-accion btn-mas" style="width:20px; height:20px; font-size:0.8rem;" onclick="modificarCarreras('${jugador.firebaseKey}', 1)">+</button>
                        </div>
                        <div class="total-carrera">${jugador.carreraTotal} pts</div>
                        <div>
                            <input type="number" id="add-${jugador.id}" class="input-sumar-carrera" placeholder="+ pts"
                                   onkeydown="chequearEnter(event, ${jugador.id})" onblur="procesarSuma('${jugador.firebaseKey}', ${jugador.id})">
                        </div>
                    `;
                } else {
                    fila.innerHTML = `
                        <div class="posicion">#${indice + 1}</div>
                        <div class="nombre">${jugador.nombre}</div>
                        <div class="puntos-copas">${jugador.copas}</div>
                        <div class="total-carreras-num">${jugador.carreras}</div>
                        <div class="total-carrera">${jugador.carreraTotal} pts</div>
                    `;
                }
                tablaBody.appendChild(fila);
            });

            jugadores.forEach(j => {
                const el = document.getElementById(`jugador-${j.id}`);
                const posVieja = posicionesViejas[j.id];
                if (el && posVieja !== undefined) {
                    const posNueva = el.getBoundingClientRect().top;
                    const diferenciaY = posVieja - posNueva;
                    if (diferenciaY !== 0) {
                        el.style.transform = `translateY(${diferenciaY}px)`;
                        el.style.transition = 'none';
                        el.offsetHeight; 
                        el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        el.style.transform = 'translateY(0)';
                    }
                }
            });
        }

        function modificarCopas(firebaseKey, cantidad) {
            const j = jugadores.find(x => x.firebaseKey === firebaseKey);
            if (j && db) {
                j.copas = Math.max(0, j.copas + cantidad);
                mandarANube(j);
            }
        }

        function modificarCarreras(firebaseKey, cantidad) {
            const j = jugadores.find(x => x.firebaseKey === firebaseKey);
            if (j && db) {
                j.carreras = Math.max(0, j.carreras + cantidad);
                mandarANube(j);
            }
        }

        function agregarJugador() {
            const input = document.getElementById('nuevo-nombre');
            const nombre = input.value.trim().toUpperCase();
            if (nombre === "" || jugadores.some(j => j.nombre === nombre) || !db) return;

            const nuevoCorredor = {
                id: Date.now(),
                nombre: nombre,
                copas: 0,
                carreras: 0,
                carreraTotal: 0
            };

            db.ref('jugadores').push(nuevoCorredor).then(() => {
                input.value = "";
            });
        }

        function eliminarJugador() {
            const key = selectEliminar.value;
            if (!key || !db) return;
            const j = jugadores.find(x => x.firebaseKey === key);
            if (confirm(`¿Seguro que quieres eliminar a ${j.nombre}?`)) {
                db.ref('jugadores/' + key).remove();
            }
        }

        function chequearEnter(event, id) {
            if (event.key === 'Enter') document.getElementById(`add-${id}`).blur();
        }

        function procesarSuma(firebaseKey, id) {
            const input = document.getElementById(`add-${id}`);
            if (!input || input.value === "") return;
            const valor = parseInt(input.value);
            input.value = "";

            if (!isNaN(valor) && valor !== 0) {
                const j = jugadores.find(x => x.firebaseKey === firebaseKey);
                if (j) {
                    j.carreraTotal = Math.max(0, j.carreraTotal + valor);
                    mandarANube(j);
                }
            }
        }

        function reiniciarTabla() {
            if (confirm("¿Restablecer marcadores de todos a cero?")) {
                jugadores.forEach(j => {
                    j.copas = 0;
                    j.carreras = 0;
                    j.carreraTotal = 0;
                    mandarANube(j);
                });
            }
        }
    </script>
</body>
</html>
